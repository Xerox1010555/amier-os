# Jarvis AI orchestrator — cloud deployment (containerized service only;
# the desktop app and Rust engine stay on-device, never in the cloud).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-orchestrator
  labels:
    app: jarvis
    component: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis
      component: orchestrator
  template:
    metadata:
      labels:
        app: jarvis
        component: orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: ghcr.io/jarvis-os/orchestrator:1.0.0
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: JARVIS_BIND_HOST
              value: "0.0.0.0"
            - name: JARVIS_REQUIRE_AUTH
              value: "true"
            - name: JARVIS_LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: jarvis-config
                  key: provider
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jarvis-secrets
                  key: openai-api-key
                  optional: true
            - name: JARVIS_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: jarvis-secrets
                  key: shared-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
