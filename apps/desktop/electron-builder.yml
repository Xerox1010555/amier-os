appId: local.amier.os
productName: Amier OS
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"
win:
  target: nsis
  icon: assets/icon.png
  # Unsignable locally: rcedit/winCodeSign fails on non-ASCII build paths.
  # NSIS still embeds the icon; CI (ASCII path) may sign & brand the exe.
  signAndEditExecutable: false
  forceCodeSigning: false
electronVersion: 31.7.7
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: generic
  url: https://updates.amier.local/
