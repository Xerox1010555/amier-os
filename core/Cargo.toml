[package]
name = "ai-os-core"
version = "1.0.0"
edition = "2021"
description = "Jarvis OS deterministic security kernel + sandboxed executor (NAPI module)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.0", default-features = false, features = [
  "napi4",
  "serde-json",
] }
napi-derive = "2.16.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "1.0"
wait-timeout = "0.2"

[build-dependencies]
napi-build = "2.0"

[profile.release]
opt-level = 2
lto = "thin"
